# Статика клиента и прокси /api на мок-сервер (сервис api в docker-compose.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Сборка предсжата gzip -9 в Dockerfile: файл .gz отдаётся как есть, без CPU на запрос,
    # и по сети уходит то же, что меряет npm run check:size.
    gzip_static on;
    # Сжатие на лету — для ответов API (JSON дерева) и того, что не предсжато.
    # text/event-stream не сжимается: вместе с буферизацией прокси сжатие держит события.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    # Меньше ~1 КБ выигрыш съедают заголовки gzip.
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Заголовки заданы здесь и наследуются обоими location с proxy_pass: объявление
    # proxy_set_header внутри location отменило бы наследование.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    # Referer проходит как есть: из него мок-сервер берёт scenario и delay.

    # Имена с хэшем: по одному имени содержимое не меняется.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Нет файла — 404, а не index.html: иначе HTML закэшировался бы на год под именем скрипта.
        try_files $uri =404;
    }

    # SPA: путь без файла — index.html. no-cache: браузер сверяется с сервером и после
    # выкладки получает новый index.html со ссылками на новые чанки.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:3001;
    }

    # SSE. proxy_buffering off — каждый прочитанный кусок уходит клиенту сразу. Проверено на
    # nginx 1.30: с буферизацией и gzip соединение живо, а события не доходят; буферизация
    # без сжатия события не задержала, но на это не полагаемся. Сервер шлёт и
    # X-Accel-Buffering: no — конфиг от этого заголовка не зависит.
    location = /api/org-tree/stream {
        proxy_pass http://api:3001;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
        gzip off;
    }
}
